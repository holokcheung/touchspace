# XcodeGen spec. The generated TouchSpaceScanner.xcodeproj is committed, so teammates can
# open it directly; regenerate with `xcodegen generate --spec legacy-scanner.yml` after adding or removing files.
name: TouchSpaceScanner
options:
  bundleIdPrefix: ai.touchspace
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  TouchSpaceScanner:
    type: application
    platform: iOS
    sources:
      - path: TouchSpaceScanner
      # Shared with the web walk-through; see docs/soundscape.md.
      - path: ../shared/soundscape.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.touchspace.scanner
        INFOPLIST_FILE: TouchSpaceScanner/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
