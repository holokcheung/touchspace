name: TouchspaceAI
options:
  bundleIdPrefix: ai.touchspace
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  TouchspaceCore:
    path: TouchspaceCore
targets:
  TouchspaceAI:
    type: application
    platform: iOS
    sources: [TouchspaceAI]
    info:
      path: TouchspaceAI/Info.plist
      properties:
        CFBundleDisplayName: Touchspace AI
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Scan a space and relocalize your phone in a downloaded indoor map. Camera frames stay on your device.
        NSMicrophoneUsageDescription: Dictate questions about your map.
        NSSpeechRecognitionUsageDescription: Convert spoken questions to text on your device when supported.
        NSLocalNetworkUsageDescription: Connect to your configured Touchspace AI development server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Touchspace map
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [ai.touchspace.map, public.zip-archive]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ai.touchspace.map
            UTTypeDescription: Touchspace AI indoor map
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [touchspacemap]
    dependencies:
      - package: TouchspaceCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: ai.touchspace.ios
        CODE_SIGN_STYLE: Automatic
  TouchspaceAITests:
    type: bundle.unit-test
    platform: iOS
    sources: [TouchspaceAITests]
    dependencies:
      - target: TouchspaceAI
  TouchspaceAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TouchspaceAIUITests]
    dependencies:
      - target: TouchspaceAI
schemes:
  TouchspaceAI:
    build:
      targets:
        TouchspaceAI: all
    test:
      targets: [TouchspaceAITests, TouchspaceAIUITests]
