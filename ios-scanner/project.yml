name: TouchSpace
options:
  bundleIdPrefix: ai.touchspace
  deploymentTarget:
    iOS: '17.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  TouchSpace:
    type: application
    platform: iOS
    sources:
      - TouchSpace
      - path: ../sample-data/mock-maps/harbour-clinic.touchspacemap
        buildPhase: resources
      - path: ../sample-data/mock-maps/neighbourhood-library.touchspacemap
        buildPhase: resources
    info:
      path: TouchSpace/Info.plist
      properties:
        CFBundleDisplayName: TouchSpace
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan rooms and align saved maps with the venue for AR guidance.
        NSMicrophoneUsageDescription: Ask a question about the saved map using your voice.
        NSSpeechRecognitionUsageDescription: Turn a spoken map question into text after you tap the microphone.
        NSLocalNetworkUsageDescription: Connect to your chosen TouchSpace demo backend on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: TouchSpace map
            LSHandlerRank: Owner
            LSItemContentTypes: [ai.touchspace.map]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ai.touchspace.map
            UTTypeDescription: TouchSpace map package
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [touchspacemap]
              public.mime-type: [application/vnd.touchspace.map+zip]
    dependencies:
      - package: ZIPFoundation
  TouchSpaceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TouchSpaceTests
      - path: ../shared/fixtures
        buildPhase: resources
      - path: ../sample-data/mock-maps/harbour-clinic.touchspacemap
        buildPhase: resources
      - path: ../sample-data/mock-maps/neighbourhood-library.touchspacemap
        buildPhase: resources
    dependencies:
      - target: TouchSpace
  TouchSpaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TouchSpaceUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TouchSpace
schemes:
  TouchSpace:
    build:
      targets:
        TouchSpace: all
        TouchSpaceTests: [test]
    test:
      targets: [TouchSpaceTests, TouchSpaceUITests]
