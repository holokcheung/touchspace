<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DotPad · Mock viewer</title>
  <link rel="stylesheet" href="/viewer.css">
  <script type="module" src="/viewer.js"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div><p class="eyebrow">TOUCHSPACE / DEVELOPER TOOLS</p><h1>DotPad <span>mock viewer</span></h1></div>
      <span id="connection" class="connection">Connecting…</span>
    </header>
    <div class="toolbar">
      <p>Raw pins. A live view of your Python gateway.</p>
      <div id="mock-controls" hidden>
        <button data-command="demo">Load demo</button>
        <button data-command="refresh">Refresh</button>
        <button data-command="clear">Clear</button>
      </div>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <section class="device-stage" aria-label="DotPad viewed from above">
      <div class="device">
        <div class="device-top"><span class="device-brand">dot<span class="brand-dot">.</span></span><span class="device-led" aria-hidden="true"></span></div>
        <div class="graphic-bezel">
          <canvas id="graphics" role="img" aria-label="Graphic pin display, all pins lowered"></canvas>
        </div>
        <div class="device-buttons" aria-label="DotPad hardware buttons">
          <button class="pad-button pan left" data-button="panning_left" aria-label="Panning left" aria-pressed="false"><span aria-hidden="true">◀</span></button>
          <button class="pad-button" data-button="function1" aria-label="Function 1" aria-pressed="false"><span aria-hidden="true">Ⅰ</span></button>
          <button class="pad-button" data-button="function2" aria-label="Function 2" aria-pressed="false"><span aria-hidden="true">Ⅱ</span></button>
          <button class="pad-button" data-button="function3" aria-label="Function 3" aria-pressed="false"><span aria-hidden="true">Ⅲ</span></button>
          <button class="pad-button" data-button="function4" aria-label="Function 4" aria-pressed="false"><span aria-hidden="true">Ⅳ</span></button>
          <button class="pad-button pan right" data-button="panning_right" aria-label="Panning right" aria-pressed="false"><span aria-hidden="true">▶</span></button>
        </div>
        <div class="braille-bezel"><canvas id="braille" role="img" aria-label="Braille cell display, all pins lowered"></canvas></div>
        <div class="device-bottom"><span>DOT PAD</span><span>TACTILE DISPLAY</span></div>
      </div>
    </section>
    <footer class="viewer-footer">
      <div class="legend"><span class="pin-example raised"></span> Raised <span class="pin-example"></span> Lowered</div>
      <p id="dimensions">60 × 40 graphic pins · 20 braille cells</p>
      <p id="revision">Frame 0</p>
    </footer>
    <section class="events" aria-labelledby="events-title"><h2 id="events-title">Button events</h2><p id="event-log" aria-live="polite">Press a device button to send a callback.</p></section>
  </main>
</body>
</html>
